name: Windows 1.0

on:
    push:
        tags:
            - 'v*'
            - '[0-9]*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    nsis:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc

            - uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Build NSIS installer
              env:
                  CARGO_TARGET_DIR: ${{ github.workspace }}/target-local
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: node .scripts/run-tool.cjs tauri build -b nsis --target x86_64-pc-windows-msvc

            - name: Write updater manifest
              env:
                  CARGO_TARGET_DIR: ${{ github.workspace }}/target-local
              run: node updater/from-artifacts.mjs

            - name: Upload installer artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows-x64-nsis
                  path: |
                      target-local/x86_64-pc-windows-msvc/release/bundle/nsis/*
                      update.json
                  if-no-files-found: error

            - name: Publish GitHub release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      target-local/x86_64-pc-windows-msvc/release/bundle/nsis/*
                      update.json
                  generate_release_notes: true

            - name: Publish updater tag
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: updater
                  name: updater
                  body: Forge updater manifest
                  files: update.json
                  make_latest: false
