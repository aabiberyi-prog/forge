# Forge Windows 1.0 uses windows-release.yml.
# The old pot-app linux/macos/homebrew/winget/docs jobs are disabled so a
# push cannot publish to Pylogmon.pot or pot-app/pot-docs.
name: Package
on:
    workflow_dispatch:

jobs:
    point-at-windows-1-0:
        runs-on: ubuntu-latest
        steps:
            - name: Use windows-release.yml
              run: |
                  echo "Forge Windows 1.0 builds run from .github/workflows/windows-release.yml"
                  echo "This workflow is kept as a no-op so the old pot-app release jobs do not fire."
